<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donut MIDI · Screen mat</title>
<style>html,body{margin:0;background:#ddd;height:100%;font-family:system-ui}body{display:flex;flex-direction:column;align-items:center}header{height:48px;display:flex;align-items:center;gap:20px;font-size:14px}button{padding:7px 16px;cursor:pointer}main{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}body:fullscreen header{display:none}body:fullscreen main{height:100vh}</style>
<header><span>Keep all four markers visible · look at donuts to play · look at REST to pause</span><button id="full">Full-screen mat</button></header>
<main><img src="monitor-mat.svg?v=english-1" alt="Four AprilTag markers, eight donuts and a rest area"></main>
<script>document.querySelector('#full').onclick=()=>document.body.requestFullscreen();</script></html>
