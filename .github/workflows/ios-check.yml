name: iOS beta build check
on:
  push:
    paths: ['ios/**', 'scripts/prepare_ios.py', '*.js', '*.css', '*.html', 'vendor/**', '.github/workflows/ios-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/prepare_ios.py
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml
      - name: Build unsigned simulator app
        run: xcodebuild -project ios/DonutMIDI.xcodeproj -scheme DonutMIDI -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Check offline resources were bundled
        run: test -f build/ios/Build/Products/Debug-iphonesimulator/DonutMIDI.app/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: DonutMIDI-iOS-Simulator-only
          path: build/ios/Build/Products/Debug-iphonesimulator/DonutMIDI.app
