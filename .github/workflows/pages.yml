name: Publish Donut MIDI
on:
  push:
    branches: [aoi-cognitive-voices]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  mac-launcher:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Mac app and disk image
        run: python3 scripts/build_mac_app.py
      - name: Verify Mac launcher
        run: python3 scripts/verify_mac_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: mac-launcher
          path: dist/mac/*
  deploy:
    needs: mac-launcher
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript
        run: node --test tests/*.test.cjs
      - name: Check local connector transport
        run: |
          python3 -m unittest discover -s tests -p 'test_connector.py'
          python3 -m unittest discover -s tests -p 'test_device*.py'
          python3 -m unittest discover -s tests -p 'test_study.py'
      - name: Prepare public files
        run: |
          mkdir -p _site/vendor _site/library/templates _site/library/assets
          cp device-selector.js study-core.js study.js game-mix.js game-core.js game-mode.js gaze-art.js gaze-art-view.js soundscapes.js cognitive-evidence.js cognitive-panel.js eye-canvas.js dashboard.js dashboard.css index.html style.css core.js app.js patterns.js curve.js states.js studio.js pattern-view.js sample-controls.js midi-core.js music.js research-session.js public.js connector-client.js connector.js connector-guide.html mat.svg markers.svg monitor-mat.svg monitor.html _site/
          cp library/p5.neon-effects.js library/template-catalog.js library/project-zip.js library/catalog-editor.js library/layout-core.js library/layout-editor.js library/physical-template.js library/preview-runtime.js library/console.js library/editor.html library/editor.css library/editor.js library/editor-split.js library/template.js library/p5.neon.js library/index.html library/style.css library/example.js library/README.md library/LICENSE _site/library/
          cp library/templates/*.js _site/library/templates/
          cp library/assets/*.png _site/library/assets/
          cp vendor/p5.min.js vendor/p5-LICENSE.txt _site/vendor/
          python3 scripts/build_p5_library.py --output _site/downloads/p5-neon-0.2.0.zip
          python3 scripts/build_connector.py --output _site/downloads/donut-midi-connector.zip
          touch _site/.nojekyll
      - uses: actions/download-artifact@v4
        with:
          name: mac-launcher
          path: _site/downloads
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
