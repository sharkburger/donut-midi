name: iOS touch and replay checks
on:
  push:
    branches: [ios-touch-testflight]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  touch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/prepare_ios.py
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Check staged mobile interactions
        run: |
          mkdir -p build
          python3 -m http.server 18089 --bind 127.0.0.1 --directory ios/web > build/http.log 2>&1 &
          node tests/ios-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-touch-verification
          path: build/
