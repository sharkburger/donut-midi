name: Instrument browser checks
on:
  push:
    paths: ['*.js', '*.css', '*.html', 'tests/**', '.github/workflows/web-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/core.test.cjs tests/audio.test.cjs
      - name: Exercise desktop and touch interactions
        run: |
          mkdir -p build
          python3 -m http.server 18088 --bind 127.0.0.1 > build/http.log 2>&1 &
          node tests/browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: build/
