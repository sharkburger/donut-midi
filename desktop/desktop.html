<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donut Song · 桌面测试版</title>
<style>body{margin:0;font-family:system-ui;background:#f7f4ee;color:#292820}nav{display:flex;align-items:center;gap:12px;padding:12px 20px;flex-wrap:wrap}b{margin-right:auto}button,a{padding:9px 13px;border:1px solid #bbb;border-radius:8px;background:white;color:inherit;text-decoration:none;cursor:pointer}small{display:block;width:100%;color:#625d51}iframe{width:100%;height:calc(100vh - 140px);border:0}#status{font-size:13px}</style>
<nav><b>◎ Donut Song <span style="font-weight:400">0.2.0-beta.1</span></b><a href="play.html" target="_blank">单独打开演奏台</a><button id="start">启动 Neon 连接</button><button id="stop">停止连接</button><button id="quit">退出软件</button><small>模拟与回放可离线使用。Neon 需要 Companion 同一局域网；真实设备尚待联调。关闭浏览器前请停止并导出记录，再点“退出软件”。</small><span id="status" role="status">设备连接尚未启动</span></nav>
<iframe title="Donut Song 演奏台" src="play.html"></iframe>
<script>const token='__TOKEN__';async function action(name){try{const r=await fetch('/api/'+name,{method:'POST',headers:{'X-Donut-Token':token}});if(!r.ok)throw Error('操作失败 '+r.status);const data=await r.json();document.getElementById('status').textContent=name==='quit'?'软件已退出，可以关闭此页面。':data.status;}catch(e){document.getElementById('status').textContent=e.message;}}
for(const name of ['start','stop','quit'])document.getElementById(name).onclick=()=>{if(name==='quit'&&!confirm('请先停止并导出需要保留的记录。确定退出软件？'))return;action(name);};setInterval(()=>action('status'),5000);</script></html>
