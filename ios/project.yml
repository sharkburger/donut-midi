name: DonutSong
options:
  bundleIdPrefix: io.github.sharkburger
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1,2'
    PRODUCT_BUNDLE_IDENTIFIER: io.github.sharkburger.donutsong
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  DonutSong:
    type: application
    platform: iOS
    sources:
      - path: DonutSong
        excludes:
          - Info.plist
      - path: web
        type: folder
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DonutSong/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  DonutSong:
    build:
      targets:
        DonutSong: all
